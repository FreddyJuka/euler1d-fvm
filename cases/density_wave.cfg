# Advected smooth density wave on a periodic domain (one full period at t = 1).
# Exact solution: rho(x,t) = rho0 + A sin(2 pi k (x - u0 t - x_min)/L), u = u0, p = p0.
# Used for convergence studies; errors are measured against exact cell averages.
problem = density_wave
n_cells = 100
x_min = 0.0
x_max = 1.0
rho0 = 1.0
amplitude = 0.2
u0 = 1.0
p0 = 1.0
wavenumber = 1
t_final = 1.0
cfl = 0.8
flux = hllc
reconstruction = muscl
limiter = vanleer
bc_left = periodic
bc_right = periodic
output_dir = results/density_wave
