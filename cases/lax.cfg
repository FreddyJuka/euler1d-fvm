# Lax shock tube. Reference: P. D. Lax, Commun. Pure Appl. Math. 7 (1954) 159-193;
# standard test in Toro, Riemann Solvers and Numerical Methods for Fluid Dynamics.
problem = riemann
n_cells = 200
x_min = 0.0
x_max = 1.0
x0 = 0.5
rho_L = 0.445
u_L = 0.698
p_L = 3.528
rho_R = 0.5
u_R = 0.0
p_R = 0.571
t_final = 0.14
cfl = 0.8
flux = hllc
reconstruction = muscl
limiter = minmod
bc_left = transmissive
bc_right = transmissive
output_dir = results/lax
