name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEULER1D_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DEULER1D_SANITIZE=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  verification:
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Python tests
        run: python -m pytest tests/python
      - name: Convergence study
        run: scripts/run_convergence.sh -n "50 100 200 400" -o results/ci_convergence
      - name: Check observed orders
        run: |
          python python/check_convergence.py results/ci_convergence/convergence.csv \
            --variant hllc_muscl_unlimited --norm L1 --min 1.9 --max 2.1
          python python/check_convergence.py results/ci_convergence/convergence.csv \
            --variant hllc_muscl_unlimited --norm Linf --min 1.9 --max 2.1
          python python/check_convergence.py results/ci_convergence/convergence.csv \
            --variant hllc_first_order --norm L1 --min 0.85 --max 1.1
      - name: Upload convergence report
        uses: actions/upload-artifact@v4
        with:
          name: convergence
          path: |
            results/ci_convergence/convergence.md
            results/ci_convergence/convergence_L1.png
      - name: Shock tubes
        run: scripts/run_shock_tubes.sh
      - name: Check shock-tube errors
        run: |
          python python/check_shock_tube.py results/shock_tubes/sod_metrics.csv \
            --label "HLLC MUSCL minmod" --max-l1 4.702e-3
          python python/check_shock_tube.py results/shock_tubes/lax_metrics.csv \
            --label "HLLC MUSCL minmod" --max-l1 1.814e-2
      - name: Upload shock-tube report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shock-tubes
          path: |
            results/shock_tubes/*_metrics.csv
            results/shock_tubes/*_comparison.png
